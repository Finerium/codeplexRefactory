# Codeplex Chronicle Secrets Template (Atlas Wave 3)
#
# CRITICAL Lock 3 anti-pattern: this template file is committable because
# all values are PLACEHOLDER markers. Real secret values NEVER go into this
# file; instead `scripts/populate-secrets.sh` reads `.env` (gitignored,
# mode 600) and creates real Secret objects via `kubectl create secret ...
# --dry-run=client -o yaml | kubectl apply -f -` (idempotent).
#
# 4 Secret objects:
#   duopoly-deepseek      DeepSeek API key (Triton Wave 3 consumer)
#   duopoly-github-oauth  GitHub OAuth client-id + client-secret + webhook-secret
#                         (Hades Wave 3 consumer)
#   duopoly-db            PostgreSQL DATABASE_URL (Demeter Wave 3 consumer)
#   duopoly-session       JWT session signing key (Hades Wave 3 consumer)
#
# DO NOT `kubectl apply -f` this file directly. It will create secrets with
# placeholder values that the application will reject. Always invoke
# `scripts/populate-secrets.sh` after .env is populated.

apiVersion: v1
kind: Secret
metadata:
  name: duopoly-deepseek
  namespace: duopoly
  labels:
    app: codeplex-chronicle
    owner: atlas
type: Opaque
stringData:
  api-key: "__POPULATE_VIA_SCRIPT__"
---
apiVersion: v1
kind: Secret
metadata:
  name: duopoly-github-oauth
  namespace: duopoly
  labels:
    app: codeplex-chronicle
    owner: atlas
type: Opaque
stringData:
  client-id: "__POPULATE_VIA_SCRIPT__"
  client-secret: "__POPULATE_VIA_SCRIPT__"
  webhook-secret: "__POPULATE_VIA_SCRIPT__"
---
apiVersion: v1
kind: Secret
metadata:
  name: duopoly-db
  namespace: duopoly
  labels:
    app: codeplex-chronicle
    owner: atlas
type: Opaque
stringData:
  url: "__POPULATE_VIA_SCRIPT__"
---
apiVersion: v1
kind: Secret
metadata:
  name: duopoly-session
  namespace: duopoly
  labels:
    app: codeplex-chronicle
    owner: atlas
type: Opaque
stringData:
  secret: "__POPULATE_VIA_SCRIPT__"
