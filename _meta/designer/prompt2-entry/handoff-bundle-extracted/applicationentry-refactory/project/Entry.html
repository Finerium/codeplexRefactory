<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Codeplex Chronicle — Entry</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&family=JetBrains+Mono:wght@300;400;500;600&display=swap" rel="stylesheet">

<style>
  :root {
    --bg-deep: oklch(0.115 0.018 55);
    --bg-room: oklch(0.16 0.025 60);
    --bg-room-hi: oklch(0.21 0.03 62);
    --wood: oklch(0.205 0.04 50);
    --wood-hi: oklch(0.27 0.05 55);
    --sill: oklch(0.32 0.05 60);
    --frame: oklch(0.13 0.02 50);
    --frame-edge: oklch(0.4 0.04 65);

    --ink: oklch(0.96 0.015 80);
    --ink-soft: oklch(0.82 0.02 75);
    --mute: oklch(0.62 0.02 70);
    --faint: oklch(0.42 0.02 65);

    --ember: oklch(0.72 0.17 55);
    --ember-deep: oklch(0.55 0.18 45);
    --brass: oklch(0.78 0.13 85);
    --brass-soft: oklch(0.62 0.1 82);

    --glass-warm: oklch(0.65 0.16 65);
    --glass-warm-deep: oklch(0.42 0.13 55);
    --sky-cool: oklch(0.33 0.05 235);
    --sky-cool-deep: oklch(0.18 0.04 240);
    --sodium: oklch(0.78 0.14 75);

    --rule: rgba(255, 240, 210, 0.08);
    --rule-hi: rgba(255, 240, 210, 0.16);

    --font-display: "Space Grotesk", ui-sans-serif, system-ui, sans-serif;
    --font-body: "Space Grotesk", ui-sans-serif, system-ui, sans-serif;
    --font-mono: "JetBrains Mono", ui-monospace, "SF Mono", Menlo, monospace;
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    background: var(--bg-deep);
    color: var(--ink);
    font-family: var(--font-body);
    -webkit-font-smoothing: antialiased;
    text-rendering: optimizeLegibility;
    min-height: 100vh;
    overflow-x: hidden;
  }

  .room {
    position: relative;
    min-height: 100vh;
    background:
      radial-gradient(ellipse 80% 60% at 50% 10%, rgba(255, 160, 80, 0.06), transparent 60%),
      radial-gradient(ellipse 60% 80% at 15% 80%, rgba(180, 100, 40, 0.08), transparent 60%),
      radial-gradient(ellipse 60% 80% at 85% 80%, rgba(180, 100, 40, 0.08), transparent 60%),
      linear-gradient(180deg, var(--bg-deep) 0%, var(--bg-room) 38%, var(--bg-room) 64%, var(--wood) 100%);
  }
  .room::before {
    content: "";
    position: absolute;
    left: 0; right: 0; bottom: 26%;
    height: 1px;
    background: linear-gradient(90deg, transparent, var(--rule-hi) 20%, var(--rule-hi) 80%, transparent);
    pointer-events: none;
  }
  .room::after {
    content: "";
    position: absolute; inset: 0;
    pointer-events: none;
    background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='2' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 0.95 0 0 0 0 0.85 0 0 0 0 0.65 0 0 0 0.06 0'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>");
    mix-blend-mode: overlay;
    opacity: 0.5;
  }

  ::selection { background: var(--ember-deep); color: var(--ink); }

  .mono { font-family: var(--font-mono); }
  .upper { text-transform: uppercase; letter-spacing: 0.14em; }
  .micro { font-family: var(--font-mono); font-size: 11px; letter-spacing: 0.04em; }

  :focus-visible { outline: 1px solid var(--ember); outline-offset: 3px; border-radius: 4px; }
</style>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

</head>
<body>
  <div id="root"></div>

  <script type="text/babel" src="tweaks-panel.jsx"></script>
  <script type="text/babel" src="city-scenes.jsx"></script>
  <script type="text/babel" src="entry-app.jsx"></script>
</body>
</html>
