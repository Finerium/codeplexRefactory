# Alembic config (Demeter Wave 3).
#
# Async asyncpg driver per SQLAlchemy 2.x async pattern. Database URL is
# loaded from `DATABASE_URL` env at runtime via `migrations/env.py`.

[alembic]
script_location = migrations
prepend_sys_path = .
sqlalchemy.url =
file_template = %%(year)d%%(month).2d%%(day).2d_%%(rev)s_%%(slug)s
truncate_slug_length = 40
revision_environment = false
sourceless = false

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
