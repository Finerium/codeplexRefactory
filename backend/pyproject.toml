[project]
name = "codeplex-chronicle-backend"
version = "0.1.0"
description = "Codeplex Chronicle backend - FastAPI + tree-sitter 11-language parser + GitHub OAuth real + webhook HMAC + WebSocket 3 channel"
readme = "README.md"
requires-python = ">=3.12"
authors = [
    {name = "Tim Duopoly - Ghaisan Khoirul Badruzaman"},
    {name = "Tim Duopoly - Hafiz Fauzan Syafrudin"},
]

# Wave 3 Hades foundation deps. Locked PRD Section 17.
# Python 3.12+ (project policy). Verified compat with 3.14 ambient.
dependencies = [
    # Web framework
    "fastapi>=0.115.0,<0.130.0",
    "uvicorn[standard]>=0.32.0",
    "python-multipart>=0.0.12",
    "websockets>=13.0",

    # Validation + settings
    "pydantic>=2.9.0",
    "pydantic-settings>=2.6.0",

    # HTTP client (OAuth token exchange + GitHub API calls)
    "httpx>=0.27.0",

    # DeepSeek V4 LLM client via OpenAI SDK ChatCompletions compat
    # (Triton Wave 3 gateway, base_url=https://api.deepseek.com)
    # Atlas D-Atlas-20 cycle 3: missing from Hades baseline pyproject.toml
    # but imported by app.llm.client. Container start failed without it.
    "openai>=1.50.0",

    # Numeric stack for Triton semantic cache cosine similarity vector ops.
    # Atlas D-Atlas-20 cycle 3: missing from Hades baseline pyproject.toml
    # but imported by app.services.semantic_cache.
    "numpy>=1.26.0",

    # Tree-sitter parser stack (11-language pack permissive MIT per Phase B Topic 3c)
    "tree-sitter>=0.23.0",
    "tree-sitter-language-pack>=0.7.0",

    # Database (Demeter integration; Hades imports Protocol-based stub)
    "sqlalchemy[asyncio]>=2.0.30",
    "asyncpg>=0.30.0",
    "alembic>=1.13.0",

    # JWT session token (OAuth callback session signing)
    "pyjwt[crypto]>=2.9.0",

    # Cryptography (encrypted token at rest helper, AES-256-GCM via cryptography library)
    "cryptography>=43.0.0",

    # Diagram pipeline (Phanes Wave-Fixing #2 cycle 1, Bug #11 rescue)
    # PRD Section 17.3 line 1089 LOCKED: "Diagram generation | mermaid-py +
    # graphviz + eralchemy | Internal renderer pipeline, output JSON schema
    # yang city renderer baca". Silent Lock 3 scope narrow Hephaestus Wave 0
    # ZERO worker assigned; Phanes rescue cycle 1. graphviz pure-Python (NOT
    # pygraphviz) calls dot binary at runtime. eralchemy2 maintained fork of
    # original eralchemy (which is dead upstream). Both eralchemy2 + pygraphviz
    # transitive require system graphviz dev headers (brew install graphviz).
    "mermaid-py>=0.8.0",
    "graphviz>=0.20.0",
    "eralchemy2>=1.4.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=5.0.0",
    "httpx>=0.27.0",
    "ruff>=0.7.0",
    "mypy>=1.13.0",
]

[build-system]
requires = ["setuptools>=68.0.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]
exclude = ["tests*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = "test_*.py"
addopts = "-v --tb=short"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.mypy]
python_version = "3.12"
strict = false
ignore_missing_imports = true
